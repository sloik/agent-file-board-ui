<svg class="signing-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 423" width="360" role="img" aria-labelledby="sg-channels-t sg-channels-d"><style>:root{--sg-box:#fafbfc;--sg-line:#9aa4b2;--sg-ink:#1c2230;--sg-muted:#5b6472;--sg-accent:#2465a8;--sg-ok:#2e7d4f;--sg-ok-bg:#e7f5ec;--sg-warn:#8a4b00;--sg-warn-bg:#fff4e5}@media(prefers-color-scheme:dark){:root{--sg-box:#1d2229;--sg-line:#4a5260;--sg-ink:#e7eaf0;--sg-muted:#98a1ad;--sg-accent:#8fb4ff;--sg-ok:#7bd3a0;--sg-ok-bg:#12301f;--sg-warn:#ffcf86;--sg-warn-bg:#3a2a10}}.sg-box{fill:var(--sg-box);stroke:var(--sg-line)}.sg-ok{fill:var(--sg-ok-bg);stroke:var(--sg-ok)}.sg-warn{fill:var(--sg-warn-bg);stroke:var(--sg-warn)}.sg-secret{fill:var(--sg-warn-bg);stroke:var(--sg-warn);stroke-dasharray:4 3}.sg-t{fill:var(--sg-ink);font:12px system-ui,-apple-system,Segoe UI,sans-serif}.sg-b{font-weight:700}.sg-n{fill:var(--sg-muted)}.sg-link{stroke:var(--sg-muted);fill:none;stroke-width:1.5}.sg-head{fill:var(--sg-accent)}</style><title id="sg-channels-t">Two channels: the board and a channel you already trust</title><desc id="sg-channels-d">The board shows the key to check. The value to compare it with must come from its owner by another route.</desc><text class="sg-t sg-b sg-head" x="8" y="18">1. The board: the key to check</text><rect class="sg-box " x="8" y="29" width="344" height="59" rx="7"/><text class="sg-t" x="16" y="46">The board lists Maya's public fingerprint.</text><text class="sg-t" x="16" y="61">Anyone who can write to the board folder could</text><text class="sg-t" x="16" y="76">have put it there.</text><text class="sg-t sg-b sg-head" x="8" y="114">2. A channel you already trust: the value to</text><text class="sg-t sg-b sg-head" x="8" y="129">compare</text><rect class="sg-box " x="8" y="140" width="344" height="74" rx="7"/><text class="sg-t" x="16" y="157">Maya reads her fingerprint on her own device</text><text class="sg-t" x="16" y="172">(Sign as me, Copy my fingerprint) and sends it</text><text class="sg-t" x="16" y="187">to Sam in person, by phone or in a chat app</text><text class="sg-t" x="16" y="202">they already use.</text><path class="sg-link" d="M40 220V256M36 250L40 257L44 250"/><text class="sg-t sg-n" x="50" y="235.5">Sam pastes it in step 2 and the viewer</text><text class="sg-t sg-n" x="50" y="250.5">compares</text><rect class="sg-box " x="8" y="258" width="110" height="29" rx="7"/><text class="sg-t sg-b" x="16" y="275">Same value</text><rect class="sg-box sg-ok" x="148" y="258" width="204" height="44" rx="7"/><text class="sg-t" x="156" y="275">Matches: Sam approves</text><text class="sg-t" x="156" y="290">Maya's key on this device.</text><path class="sg-link" d="M118 280H147M141 276L148 280L141 284"/><rect class="sg-box " x="8" y="312" width="110" height="44" rx="7"/><text class="sg-t sg-b" x="16" y="329">Different</text><text class="sg-t sg-b" x="16" y="344">value</text><rect class="sg-box sg-warn" x="148" y="312" width="204" height="59" rx="7"/><text class="sg-t" x="156" y="329">Does not match: do not</text><text class="sg-t" x="156" y="344">approve. Ask Maya to check</text><text class="sg-t" x="156" y="359">again.</text><path class="sg-link" d="M118 341.5H147M141 337.5L148 341.5L141 345.5"/><text class="sg-t sg-n" x="8" y="392">Copying the value from the board and pasting it</text><text class="sg-t sg-n" x="8" y="407">back only compares the board with itself.</text></svg>
