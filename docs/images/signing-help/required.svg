<svg class="signing-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" width="360" role="img" aria-labelledby="sg-required-t sg-required-d"><style>:root{--sg-box:#fafbfc;--sg-line:#9aa4b2;--sg-ink:#1c2230;--sg-muted:#5b6472;--sg-accent:#2465a8;--sg-ok:#2e7d4f;--sg-ok-bg:#e7f5ec;--sg-warn:#8a4b00;--sg-warn-bg:#fff4e5}@media(prefers-color-scheme:dark){:root{--sg-box:#1d2229;--sg-line:#4a5260;--sg-ink:#e7eaf0;--sg-muted:#98a1ad;--sg-accent:#8fb4ff;--sg-ok:#7bd3a0;--sg-ok-bg:#12301f;--sg-warn:#ffcf86;--sg-warn-bg:#3a2a10}}.sg-box{fill:var(--sg-box);stroke:var(--sg-line)}.sg-ok{fill:var(--sg-ok-bg);stroke:var(--sg-ok)}.sg-warn{fill:var(--sg-warn-bg);stroke:var(--sg-warn)}.sg-secret{fill:var(--sg-warn-bg);stroke:var(--sg-warn);stroke-dasharray:4 3}.sg-t{fill:var(--sg-ink);font:12px system-ui,-apple-system,Segoe UI,sans-serif}.sg-b{font-weight:700}.sg-n{fill:var(--sg-muted)}.sg-link{stroke:var(--sg-muted);fill:none;stroke-width:1.5}.sg-head{fill:var(--sg-accent)}</style><title id="sg-required-t">Why a required room refuses some messages</title><desc id="sg-required-d">In a room that requires trusted signatures, only the last case can drive replies, forms and other actions.</desc><text class="sg-t sg-b sg-head" x="8" y="18">Rule: trusted signatures required</text><rect class="sg-box " x="8" y="29" width="166" height="29" rx="7"/><text class="sg-t" x="16" y="46">Unsigned message</text><rect class="sg-box sg-warn" x="204" y="29" width="148" height="59" rx="7"/><text class="sg-t" x="212" y="46">Refused. Nobody</text><text class="sg-t" x="212" y="61">can show who wrote</text><text class="sg-t" x="212" y="76">it.</text><path class="sg-link" d="M174 58.5H203M197 54.5L204 58.5L197 62.5"/><rect class="sg-box " x="8" y="98" width="166" height="44" rx="7"/><text class="sg-t" x="16" y="115">Signed, key not</text><text class="sg-t" x="16" y="130">approved by you</text><rect class="sg-box sg-warn" x="204" y="98" width="148" height="59" rx="7"/><text class="sg-t" x="212" y="115">Refused. You can</text><text class="sg-t" x="212" y="130">read it, but not</text><text class="sg-t" x="212" y="145">act on it.</text><path class="sg-link" d="M174 127.5H203M197 123.5L204 127.5L197 131.5"/><rect class="sg-box " x="8" y="167" width="166" height="59" rx="7"/><text class="sg-t" x="16" y="184">Signed with an old,</text><text class="sg-t" x="16" y="199">retired or revoked</text><text class="sg-t" x="16" y="214">key</text><rect class="sg-box sg-warn" x="204" y="167" width="148" height="59" rx="7"/><text class="sg-t" x="212" y="184">Refused. The key</text><text class="sg-t" x="212" y="199">is no longer</text><text class="sg-t" x="212" y="214">current.</text><path class="sg-link" d="M174 196.5H203M197 192.5L204 196.5L197 200.5"/><rect class="sg-box " x="8" y="236" width="166" height="44" rx="7"/><text class="sg-t" x="16" y="253">Signed, key approved</text><text class="sg-t" x="16" y="268">by you, current</text><rect class="sg-box sg-ok" x="204" y="236" width="148" height="29" rx="7"/><text class="sg-t sg-b" x="212" y="253">Accepted.</text><path class="sg-link" d="M174 258H203M197 254L204 258L197 262"/><text class="sg-t sg-n" x="8" y="301">The same rule applies when you post: your message</text><text class="sg-t sg-n" x="8" y="316">needs your own approved key.</text></svg>
