<svg class="signing-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" role="img" aria-labelledby="sg-keys-t sg-keys-d"><style>:root{--sg-box:#fafbfc;--sg-line:#9aa4b2;--sg-ink:#1c2230;--sg-muted:#5b6472;--sg-accent:#2465a8;--sg-ok:#2e7d4f;--sg-ok-bg:#e7f5ec;--sg-warn:#8a4b00;--sg-warn-bg:#fff4e5}@media(prefers-color-scheme:dark){:root{--sg-box:#1d2229;--sg-line:#4a5260;--sg-ink:#e7eaf0;--sg-muted:#98a1ad;--sg-accent:#8fb4ff;--sg-ok:#7bd3a0;--sg-ok-bg:#12301f;--sg-warn:#ffcf86;--sg-warn-bg:#3a2a10}}.sg-box{fill:var(--sg-box);stroke:var(--sg-line)}.sg-ok{fill:var(--sg-ok-bg);stroke:var(--sg-ok)}.sg-warn{fill:var(--sg-warn-bg);stroke:var(--sg-warn)}.sg-secret{fill:var(--sg-warn-bg);stroke:var(--sg-warn);stroke-dasharray:4 3}.sg-t{fill:var(--sg-ink);font:12px system-ui,-apple-system,Segoe UI,sans-serif}.sg-b{font-weight:700}.sg-n{fill:var(--sg-muted)}.sg-link{stroke:var(--sg-muted);fill:none;stroke-width:1.5}.sg-head{fill:var(--sg-accent)}</style><title id="sg-keys-t">Your own key versus approving someone else's key</title><desc id="sg-keys-d">Two different jobs. Your own key lets you sign. Someone else's key is only something you decide to trust.</desc><text class="sg-t sg-b sg-head" x="8" y="18">A. Your own key: used to sign</text><rect class="sg-box sg-secret" x="8" y="29" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="46">You hold a private key file. It is a secret.</text><text class="sg-t" x="16" y="61">Keep it outside the board folder.</text><path class="sg-link" d="M40 79V115M36 109L40 116L44 109"/><text class="sg-t sg-n" x="50" y="102">Unlock it in Signing, in this tab</text><rect class="sg-box " x="8" y="117" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="134">The key is ready in this tab's memory only.</text><text class="sg-t" x="16" y="149">Nothing is saved or uploaded.</text><path class="sg-link" d="M40 167V191M36 185L40 192L44 185"/><text class="sg-t sg-n" x="50" y="184">You press Post</text><rect class="sg-box sg-ok" x="8" y="193" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="210">The viewer signs your message. Only the</text><text class="sg-t" x="16" y="225">signature goes into the board.</text><text class="sg-t sg-b sg-head" x="8" y="263">B. Someone else's key: approve to trust</text><rect class="sg-box " x="8" y="274" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="291">Maya's public fingerprint. It is safe to</text><text class="sg-t" x="16" y="306">share.</text><path class="sg-link" d="M40 324V360M36 354L40 361L44 354"/><text class="sg-t sg-n" x="50" y="347">Compare it with Maya by phone or in person</text><rect class="sg-box sg-ok" x="8" y="362" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="379">You approve that exact key. The approval stays</text><text class="sg-t" x="16" y="394">on this device.</text><text class="sg-t sg-n" x="8" y="423">Approving Maya's key never lets you sign as Maya.</text></svg>
