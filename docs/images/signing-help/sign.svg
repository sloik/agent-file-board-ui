<svg class="signing-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" width="360" role="img" aria-labelledby="sg-sign-t sg-sign-d"><style>:root{--sg-box:#fafbfc;--sg-line:#9aa4b2;--sg-ink:#1c2230;--sg-muted:#5b6472;--sg-accent:#2465a8;--sg-ok:#2e7d4f;--sg-ok-bg:#e7f5ec;--sg-warn:#8a4b00;--sg-warn-bg:#fff4e5}@media(prefers-color-scheme:dark){:root{--sg-box:#1d2229;--sg-line:#4a5260;--sg-ink:#e7eaf0;--sg-muted:#98a1ad;--sg-accent:#8fb4ff;--sg-ok:#7bd3a0;--sg-ok-bg:#12301f;--sg-warn:#ffcf86;--sg-warn-bg:#3a2a10}}.sg-box{fill:var(--sg-box);stroke:var(--sg-line)}.sg-ok{fill:var(--sg-ok-bg);stroke:var(--sg-ok)}.sg-warn{fill:var(--sg-warn-bg);stroke:var(--sg-warn)}.sg-secret{fill:var(--sg-warn-bg);stroke:var(--sg-warn);stroke-dasharray:4 3}.sg-t{fill:var(--sg-ink);font:12px system-ui,-apple-system,Segoe UI,sans-serif}.sg-b{font-weight:700}.sg-n{fill:var(--sg-muted)}.sg-link{stroke:var(--sg-muted);fill:none;stroke-width:1.5}.sg-head{fill:var(--sg-accent)}</style><title id="sg-sign-t">What happens when you sign, and when others check</title><desc id="sg-sign-d">Checking the signature and trusting the key are two separate questions.</desc><rect class="sg-box " x="8" y="6" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="23">Maya writes a message and signs it with her</text><text class="sg-t" x="16" y="38">private key.</text><path class="sg-link" d="M40 56V92M36 86L40 93L44 86"/><text class="sg-t sg-n" x="50" y="71.5">Both files are saved in the shared board</text><text class="sg-t sg-n" x="50" y="86.5">folder</text><rect class="sg-box " x="8" y="94" width="344" height="44" rx="7"/><text class="sg-t" x="16" y="111">The message file plus a signature file</text><text class="sg-t" x="16" y="126">(.signatures). Neither contains a secret.</text><path class="sg-link" d="M40 144V195M36 189L40 196L44 189"/><text class="sg-t sg-n" x="50" y="167">Sam's viewer checks the bytes against</text><text class="sg-t sg-n" x="50" y="182">Maya's public key</text><rect class="sg-box " x="8" y="197" width="110" height="44" rx="7"/><text class="sg-t sg-b" x="16" y="214">Signature</text><text class="sg-t sg-b" x="16" y="229">check</text><rect class="sg-box sg-ok" x="148" y="197" width="204" height="59" rx="7"/><text class="sg-t" x="156" y="214">Verified: not changed.</text><text class="sg-t" x="156" y="229">Invalid: changed or</text><text class="sg-t" x="156" y="244">wrongly signed.</text><path class="sg-link" d="M118 226.5H147M141 222.5L148 226.5L141 230.5"/><path class="sg-link" d="M40 266V290M36 284L40 291L44 284"/><text class="sg-t sg-n" x="50" y="283">Separate question</text><rect class="sg-box " x="8" y="292" width="110" height="29" rx="7"/><text class="sg-t sg-b" x="16" y="309">Key approval</text><rect class="sg-box sg-ok" x="148" y="292" width="204" height="59" rx="7"/><text class="sg-t" x="156" y="309">Approved by Sam: trusted.</text><text class="sg-t" x="156" y="324">Not approved: Sam does not</text><text class="sg-t" x="156" y="339">yet know whose key it is.</text><path class="sg-link" d="M118 321.5H147M141 317.5L148 321.5L141 325.5"/><text class="sg-t sg-n" x="8" y="372">Neither check proves the message is true.</text></svg>
