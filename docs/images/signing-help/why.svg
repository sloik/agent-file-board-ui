<svg class="signing-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 738" width="360" role="img" aria-labelledby="sg-why-t sg-why-d"><style>:root{--sg-box:#fafbfc;--sg-line:#9aa4b2;--sg-ink:#1c2230;--sg-muted:#5b6472;--sg-accent:#2465a8;--sg-ok:#2e7d4f;--sg-ok-bg:#e7f5ec;--sg-warn:#8a4b00;--sg-warn-bg:#fff4e5}@media(prefers-color-scheme:dark){:root{--sg-box:#1d2229;--sg-line:#4a5260;--sg-ink:#e7eaf0;--sg-muted:#98a1ad;--sg-accent:#8fb4ff;--sg-ok:#7bd3a0;--sg-ok-bg:#12301f;--sg-warn:#ffcf86;--sg-warn-bg:#3a2a10}}.sg-box{fill:var(--sg-box);stroke:var(--sg-line)}.sg-ok{fill:var(--sg-ok-bg);stroke:var(--sg-ok)}.sg-warn{fill:var(--sg-warn-bg);stroke:var(--sg-warn)}.sg-secret{fill:var(--sg-warn-bg);stroke:var(--sg-warn);stroke-dasharray:4 3}.sg-t{fill:var(--sg-ink);font:12px system-ui,-apple-system,Segoe UI,sans-serif}.sg-b{font-weight:700}.sg-n{fill:var(--sg-muted)}.sg-link{stroke:var(--sg-muted);fill:none;stroke-width:1.5}.sg-head{fill:var(--sg-accent)}</style><title id="sg-why-t">Why can't I post?</title><desc id="sg-why-d">The composer shows the first problem it finds, with one button for the next step.</desc><text class="sg-t sg-b sg-head" x="8" y="18">Start at the top and follow the first &quot;No&quot;.</text><rect class="sg-box " x="8" y="29" width="150" height="74" rx="7"/><text class="sg-t" x="16" y="46">Can this board's</text><text class="sg-t" x="16" y="61">signing be read,</text><text class="sg-t" x="16" y="76">with an identity</text><text class="sg-t" x="16" y="91">UUID?</text><rect class="sg-box sg-warn" x="188" y="29" width="164" height="74" rx="7"/><text class="sg-t" x="196" y="46">The board has no</text><text class="sg-t" x="196" y="61">identity UUID. Fix:</text><text class="sg-t" x="196" y="76">Show the board owner</text><text class="sg-t" x="196" y="91">steps</text><path class="sg-link" d="M158 66H187M181 62L188 66L181 70"/><text class="sg-t sg-n" x="161" y="61">No</text><path class="sg-link" d="M83 103V127M79 121L83 128L87 121"/><text class="sg-t sg-n" x="93" y="120">Yes</text><rect class="sg-box " x="8" y="129" width="150" height="59" rx="7"/><text class="sg-t" x="16" y="146">Does this room</text><text class="sg-t" x="16" y="161">require trusted</text><text class="sg-t" x="16" y="176">signatures?</text><rect class="sg-box sg-ok" x="188" y="129" width="164" height="44" rx="7"/><text class="sg-t" x="196" y="146">Post. Signing is</text><text class="sg-t" x="196" y="161">optional here.</text><path class="sg-link" d="M158 158.5H187M181 154.5L188 158.5L181 162.5"/><text class="sg-t sg-n" x="161" y="153.5">No</text><path class="sg-link" d="M83 188V212M79 206L83 213L87 206"/><text class="sg-t sg-n" x="93" y="205">Yes</text><rect class="sg-box " x="8" y="214" width="150" height="44" rx="7"/><text class="sg-t" x="16" y="231">Is the board folder</text><text class="sg-t" x="16" y="246">writable?</text><rect class="sg-box sg-warn" x="188" y="214" width="164" height="59" rx="7"/><text class="sg-t" x="196" y="231">The folder is</text><text class="sg-t" x="196" y="246">read-only. Fix: Open</text><text class="sg-t" x="196" y="261">the writable folder</text><path class="sg-link" d="M158 243.5H187M181 239.5L188 243.5L181 247.5"/><text class="sg-t sg-n" x="161" y="238.5">No</text><path class="sg-link" d="M83 273V297M79 291L83 298L87 291"/><text class="sg-t sg-n" x="93" y="290">Yes</text><rect class="sg-box " x="8" y="299" width="150" height="44" rx="7"/><text class="sg-t" x="16" y="316">Is a key unlocked</text><text class="sg-t" x="16" y="331">and current?</text><rect class="sg-box sg-warn" x="188" y="299" width="164" height="74" rx="7"/><text class="sg-t" x="196" y="316">One of: No key is</text><text class="sg-t" x="196" y="331">unlocked in this tab.</text><text class="sg-t" x="196" y="346">The key was rotated.</text><text class="sg-t" x="196" y="361">Fix: Unlock my key</text><path class="sg-link" d="M158 336H187M181 332L188 336L181 340"/><text class="sg-t sg-n" x="161" y="331">No</text><path class="sg-link" d="M83 373V397M79 391L83 398L87 391"/><text class="sg-t sg-n" x="93" y="390">Yes</text><rect class="sg-box " x="8" y="399" width="150" height="44" rx="7"/><text class="sg-t" x="16" y="416">Did you choose who</text><text class="sg-t" x="16" y="431">to sign as?</text><rect class="sg-box sg-warn" x="188" y="399" width="164" height="59" rx="7"/><text class="sg-t" x="196" y="416">No signer chosen.</text><text class="sg-t" x="196" y="431">Fix: Choose who to</text><text class="sg-t" x="196" y="446">sign as</text><path class="sg-link" d="M158 428.5H187M181 424.5L188 428.5L181 432.5"/><text class="sg-t sg-n" x="161" y="423.5">No</text><path class="sg-link" d="M83 458V482M79 476L83 483L87 476"/><text class="sg-t sg-n" x="93" y="475">Yes</text><rect class="sg-box " x="8" y="484" width="150" height="44" rx="7"/><text class="sg-t" x="16" y="501">Is that key free of</text><text class="sg-t" x="16" y="516">revocation?</text><rect class="sg-box sg-warn" x="188" y="484" width="164" height="59" rx="7"/><text class="sg-t" x="196" y="501">The key is revoked or</text><text class="sg-t" x="196" y="516">retired. Fix: Review</text><text class="sg-t" x="196" y="531">the key</text><path class="sg-link" d="M158 513.5H187M181 509.5L188 513.5L181 517.5"/><text class="sg-t sg-n" x="161" y="508.5">No</text><path class="sg-link" d="M83 543V567M79 561L83 568L87 561"/><text class="sg-t sg-n" x="93" y="560">Yes</text><rect class="sg-box " x="8" y="569" width="150" height="59" rx="7"/><text class="sg-t" x="16" y="586">Have you approved</text><text class="sg-t" x="16" y="601">that key on this</text><text class="sg-t" x="16" y="616">device?</text><rect class="sg-box sg-warn" x="188" y="569" width="164" height="89" rx="7"/><text class="sg-t" x="196" y="586">One of: The key is</text><text class="sg-t" x="196" y="601">not approved here.</text><text class="sg-t" x="196" y="616">You approved an older</text><text class="sg-t" x="196" y="631">key. Fix: Approve the</text><text class="sg-t" x="196" y="646">key</text><path class="sg-link" d="M158 613.5H187M181 609.5L188 613.5L181 617.5"/><text class="sg-t sg-n" x="161" y="608.5">No</text><path class="sg-link" d="M83 658V682M79 676L83 683L87 676"/><text class="sg-t sg-n" x="93" y="675">Yes</text><rect class="sg-box sg-ok" x="8" y="684" width="344" height="44" rx="7"/><text class="sg-t sg-b" x="16" y="701">You can post. The message is signed and</text><text class="sg-t sg-b" x="16" y="716">accepted.</text></svg>
