name: Formal models
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require reviewed implementation/model alignment
        run: python3 formal/check_alignment.py
      - name: Test fail-closed runner
        run: python3 -m unittest discover -s formal -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and check mapped signing behavior
        run: |
          npm ci --ignore-scripts
          node scripts/embed_tools.js --check
          node scripts/embed_signing.js --check
          node --test tests/signing-provider.test.js tests/signing-policy.test.js tests/signing-contract.test.js tests/signing-negative.test.js tests/signing-budgets.test.js tests/viewer-updates-unit.test.js
      - name: Check observed runtime traces and implementation mutants
        run: python3 formal/check_traces.py
      - name: Check bounded signing and update models with mutation controls
        run: python3 formal/check.py
