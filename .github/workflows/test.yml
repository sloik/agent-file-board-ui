name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The pinned standard must be resolvable as an exact tag (release_check uses git describe).
      - name: Fetch tags of the pinned standard
        run: git -C vendor/agent-file-board fetch --tags --force

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # After npm ci so the browser matches the pinned playwright version.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: DIAG localStorage on file://
        continue-on-error: true
        run: |
          echo '<!doctype html><title>x</title>' > /tmp/d.html
          node -e "
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const c=await b.newContext();const p=await c.newPage();
          await p.goto('file:///tmp/d.html');
          console.log('set', await p.evaluate(()=>{try{localStorage.setItem('a','1');return localStorage.getItem('a')}catch(e){return 'ERR '+e.name+' '+e.message}}));
          await p.reload();
          console.log('after reload', await p.evaluate(()=>{try{return localStorage.getItem('a')}catch(e){return 'ERR '+e.name}}));
          await b.close();})();"
      - name: Test (Playwright viewer tests + release_check unit tests)
        run: npm test

      - name: Release consistency check
        run: python3 scripts/release_check.py

      - name: Release consistency check against the pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_check.py --tag "$GITHUB_REF_NAME"
