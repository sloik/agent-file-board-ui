<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>Local voice draft</title><style>body{font:18px system-ui;max-width:36em;margin:2em auto;padding:1em}button{font:inherit;margin:.5em;padding:.5em}textarea{width:100%}</style><h1>Local voice draft</h1><p>Audio is recorded here for up to 60 seconds and transcribed by your local whisper.cpp process. Review the returned text in the board before inserting and sending.</p><p id="status" role="status">Ready. Press Record to grant microphone access.</p><button id="record">Record</button><button id="stop" disabled>Stop and transcribe</button><button id="cancel">Cancel</button>
<script>
'use strict';
const config=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname);
const token=config.get('token'),channel=config.get('channel'),origin=config.get('opener');
let stream,ctx,source,node,timer,parts=[],size=0,ended=false,aborted=false,request;
const status=document.getElementById('status'),record=document.getElementById('record'),stop=document.getElementById('stop');
function notify(type,text){if(window.opener&&origin)window.opener.postMessage({channel,type,text},origin==='null'?'*':origin);}
function release(){clearTimeout(timer);stream?.getTracks().forEach(t=>t.stop());node?.disconnect();source?.disconnect();ctx?.close().catch(()=>{});}
function cancel(){aborted=true;request?.abort();release();parts=[];notify('error');window.close();}
function wav(){const out=new ArrayBuffer(44+size*2),view=new DataView(out);const word=(offset,s)=>{for(let i=0;i<s.length;i++)view.setUint8(offset+i,s.charCodeAt(i));};word(0,'RIFF');view.setUint32(4,36+size*2,true);word(8,'WAVE');word(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);word(36,'data');view.setUint32(40,size*2,true);let i=44;for(const p of parts)for(const value of p){view.setInt16(i,Math.max(-1,Math.min(1,value))*(value<0?32768:32767),true);i+=2;}parts=[];return out;}
async function finish(){if(ended||!stream)return;ended=true;release();stop.disabled=true;status.textContent='Transcribing locally…';request=new AbortController();try{const response=await fetch('/transcribe',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'audio/wav','X-Voice-Language':(config.get('language')||'en-US').split('-')[0]},body:wav(),signal:request.signal});if(!response.ok)throw Error('Transcription failed ('+response.status+'). Check the helper terminal.');const result=await response.json();if(aborted)return;notify('transcript',result.text);status.textContent='Transcript returned to the board.';}catch(error){if(!aborted){status.textContent=error.message;notify('error');}}}
record.onclick=async()=>{record.disabled=true;try{if(!/^[a-f0-9]{64}$/.test(token)||!channel||!origin)throw Error('Open this helper from the board’s Voice input dialog.');stream=await navigator.mediaDevices.getUserMedia({audio:true});if(aborted){release();return;}ctx=new AudioContext({sampleRate:16000});if(ctx.sampleRate!==16000)throw Error('This browser cannot capture 16 kHz audio. Use native dictation.');source=ctx.createMediaStreamSource(stream);node=ctx.createScriptProcessor(4096,1,1);node.onaudioprocess=e=>{if(ended||aborted)return;const input=e.inputBuffer.getChannelData(0);const copy=input.slice(0,Math.max(0,960000-size));parts.push(copy);size+=copy.length;if(size>=960000)finish();};source.connect(node);node.connect(ctx.destination);await ctx.resume();stop.disabled=false;status.textContent='Recording locally…';timer=setTimeout(finish,60000);}catch(error){release();status.textContent=error.message;notify('error');}};
stop.onclick=finish;document.getElementById('cancel').onclick=cancel;
window.addEventListener('message',event=>{if(event.source===window.opener&&event.origin===origin&&event.data?.channel===channel&&event.data.type==='stop')finish();});
window.addEventListener('pagehide',()=>{aborted=true;request?.abort();release();});
</script></html>
